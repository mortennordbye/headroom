name: Desktop build

# Builds the Mac and Windows installers. Runs on PRs that touch the code they
# package (so a break surfaces before release rather than at release), and is
# called by the release workflow to produce the real artifacts.
#
# There is deliberately no `paths:` filter here. A required status check has to
# report on EVERY pull request — a filtered-out workflow reports nothing at all,
# and a PR waiting on a check that will never arrive is stuck forever. So the
# filtering moved into the `changes` job, and the `gate` job at the bottom always
# reports. `gate` is the one to mark required; the three build jobs are not.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the installers. Defaults to desktop/package.json.
        type: string
        required: false
        default: ''
    secrets:
      SIGNPATH_API_TOKEN:
        description: >-
          SignPath.io API token. Optional — without it the Windows installer
          ships unsigned, exactly as it did before.
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The path filter that used to live under `on:`. Kept to the workflow-level
  # `contents: read` on purpose — it only needs a diff. A reusable workflow
  # cannot request more than its caller granted, so any job that needs more
  # (see `build`) also has to be granted it in release.yml.
  changes:
    name: Detect packaged changes
    runs-on: ubuntu-latest
    outputs:
      packaged: ${{ steps.filter.outputs.packaged }}
    steps:
      # Only a pull_request needs a diff — a release call or a manual run always
      # builds. On a PR, checkout lands on the merge commit, so HEAD^1 is the base
      # and `git diff HEAD^1 HEAD` is exactly this PR's changes; depth 2 is enough
      # to have both, and avoids cloning the full history.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide whether the installers need building
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != 'pull_request' ]]; then
            echo 'packaged=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"; echo "$changed"
          # Keep this list in step with what the installers actually package.
          if grep -qE '^(desktop/|server/|package\.json$|package-lock\.json$|\.github/workflows/desktop-build\.yml$)' <<< "$changed"; then
            echo 'packaged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'packaged=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.packaged == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # The SignPath action reads the job's details and downloads the artifact it
      # just uploaded. Harmless when signing is off.
      actions: read
    env:
      # The `secrets` context is not available in a step-level `if`, so the whole
      # gate lives here. Release calls only (a Foundation signing request needs a
      # human to approve it, which would hang every PR — and a fork PR must never
      # see the token), and only once the token exists. `format` forces a string:
      # `inputs` is null on a pull_request, and comparing null to '' is not
      # reliably false.
      SIGN_WINDOWS: ${{ format('{0}', inputs.version) != '' && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            args: --mac --arm64
          - label: macOS (Intel)
            runner: macos-15-intel
            args: --mac --x64
          - label: Windows
            runner: windows-latest
            args: --win --x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # postinstall runs `electron-builder install-app-deps`, which rebuilds
      # better-sqlite3 against Electron's ABI rather than the runner's Node.
      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build app
        working-directory: desktop
        # Unsigned build: no certificates, so stop electron-builder hunting for
        # one in the keychain. electron-builder.yml ad-hoc signs macOS instead.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips signing on PR builds so fork PRs can't reach
          # a maintainer's certificates. There are none here — macOS is ad-hoc
          # signed, no secrets involved — and skipping makes the PR artifact
          # unusable on Apple Silicon *and* blind to signing regressions, since
          # what it checks would differ from what ships.
          CSC_FOR_PULL_REQUEST: 'true'
          VERSION: ${{ inputs.version }}
        # `npm run dist`, not electron-builder directly: dist runs the sync step
        # that assembles server/ and the frontend into the app. Calling the
        # packer on its own produces a valid installer with nothing inside it.
        run: |
          flag=()
          if [[ -n "$VERSION" ]]; then flag=("-c.extraMetadata.version=$VERSION"); fi
          npm run dist -- ${{ matrix.args }} --publish never "${flag[@]}"

      # electron-builder does not fail when a files glob matches nothing, so
      # check the packaged archive really holds the server and the frontend.
      - name: Verify the package contents
        working-directory: desktop
        run: npm run verify

      # Windows code signing, free for open source via SignPath Foundation. This
      # is what turns "Windows protected your PC — unknown publisher" into a
      # named publisher; nothing else about the installer can.
      #
      # Inert until the certificate exists: with no SIGNPATH_API_TOKEN the two
      # steps are skipped and the installer ships unsigned exactly as before.
      # Turning it on is four repository variables and one secret, no code change
      # — see desktop/README.md.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: matrix.runner == 'windows-latest' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Deliberately not named desktop-*: release.yml attaches every artifact
          # matching that pattern to the release, and this is the unsigned copy.
          name: unsigned-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: matrix.runner == 'windows-latest' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A Foundation policy requires a human to approve each release, so the
          # job waits rather than fails. An hour is generous; past that the
          # release is better re-run than left holding a runner.
          wait-for-completion-timeout-in-seconds: 3600
          # The signed .exe lands back on top of the unsigned one, so the upload
          # below ships the signed installer without knowing signing happened.
          output-artifact-directory: desktop/release

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  # The single check to mark required. It reports on every PR: green when the
  # installers built, green when nothing they package changed, red otherwise.
  # `always()` is what makes it report even when `build` was skipped — without it
  # a skipped dependency skips this too, which is the whole failure mode.
  gate:
    name: Desktop installers
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: always()
    steps:
      - name: Report
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          # A broken detector must not pass as "nothing to build" — that would
          # wave through exactly the breakage this check exists to catch.
          if [[ "$CHANGES" != 'success' ]]; then
            echo "::error::Change detection $CHANGES — cannot tell whether the installers needed building."
            exit 1
          fi
          case "$BUILD" in
            success) echo 'Installers built.' ;;
            skipped) echo 'Nothing the installers package changed; not built.' ;;
            *)       echo "::error::Desktop build $BUILD."; exit 1 ;;
          esac
