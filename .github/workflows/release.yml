name: Release

# Nothing here needs to be triggered by hand. release-please reads the
# conventional-commit messages on main, keeps a "chore(main): release x.y.z" PR
# up to date with the next version and changelog, and cuts the GitHub release
# when that PR is merged. The desktop installers are then built and attached in
# the SAME run, so no separate tag-driven build is needed.
#
# With the release GitHub App configured (secrets RELEASE_APP_CLIENT_ID and
# RELEASE_APP_PRIVATE_KEY), release-please runs as the App. Its release PR then
# gets the required checks (a PR opened with GITHUB_TOKEN never does, which is
# why it used to need an admin merge), and auto-merge is armed on it, so a
# release goes out by itself once the checks are green. Without the secrets it
# falls back to GITHUB_TOKEN and the release PR waits for a person, as before.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Get release App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Arm auto-merge on the release PR. It merges only once the required
      # checks pass, the same gate every other PR goes through.
      # The PR comes through as raw JSON and is parsed in the shell: step env
      # is evaluated even when `if` is false, so fromJSON() on an empty output
      # here would fail the job (and with it the desktop build) on every push.
      - name: Auto-merge the release PR
        if: env.HAS_APP == 'true' && steps.release.outputs.pr != ''
        run: gh pr merge --auto --squash "$(jq -r .number <<<"$PR_JSON")"
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  desktop:
    name: Desktop
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      # The Windows signing step downloads the artifact it just uploaded.
      actions: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      # Absent until the SignPath Foundation certificate is set up, which is
      # fine — the build treats an empty token as "ship unsigned".
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  attach:
    name: Attach installers
    runs-on: ubuntu-latest
    needs: [release-please, desktop]
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          pattern: desktop-*
          merge-multiple: true

      # Until the installers are signed, a checksum is the only thing a cautious
      # downloader can check the file against. Cheap to publish, so publish it.
      - name: Checksum the installers
        working-directory: installers
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" installers/* --clobber
