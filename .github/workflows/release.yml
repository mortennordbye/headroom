name: Release

# Nothing here needs to be triggered by hand. release-please reads the
# conventional-commit messages on main, keeps a "chore(main): release x.y.z" PR
# up to date with the next version and changelog, and cuts the GitHub release
# when that PR is merged. The desktop installers are then built and attached in
# the SAME run — a tag pushed by GITHUB_TOKEN does not trigger other workflows,
# so a separate tag-driven build would never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    name: Desktop
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      # The Windows signing step downloads the artifact it just uploaded.
      actions: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      # Absent until the SignPath Foundation certificate is set up, which is
      # fine — the build treats an empty token as "ship unsigned".
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  attach:
    name: Attach installers
    runs-on: ubuntu-latest
    needs: [release-please, desktop]
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          pattern: desktop-*
          merge-multiple: true

      # Until the installers are signed, a checksum is the only thing a cautious
      # downloader can check the file against. Cheap to publish, so publish it.
      - name: Checksum the installers
        working-directory: installers
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" installers/* --clobber
