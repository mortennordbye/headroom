version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      # Without this, security updates ignore groups entirely and arrive as one
      # PR per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # server/ and desktop/ declare the same runtime dependencies: the desktop app
  # runs the server under Electron's Node, so it needs its own ABI-matched copy,
  # and desktop/deps.test.js fails the build if the two drift. Updating them in
  # separate PRs therefore produces two PRs that each fail on their own. One
  # entry across both directories, with a single catch-all group so major bumps
  # are covered too, keeps a shared bump in one mergeable PR.
  - package-ecosystem: "npm"
    directories:
      - "/server"
      - "/desktop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5
    groups:
      server-and-desktop:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
