appId: it.nordbye.headroom
productName: Headroom
copyright: Copyright © Morten Nordbye

directories:
  output: release
  buildResources: build

# server/ is generated by `npm run sync` (server sources + the frontend build).
# Its runtime deps come from desktop/package.json, so node resolution finds them
# by walking up from server/ to the app root.
files:
  - main.js
  - update.js
  - package.json
  - server/**

# better-sqlite3 loads a native .node binary, which can't be read from inside
# the asar archive.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

mac:
  target: dmg
  category: public.app-category.finance
  icon: ../public/icon-512.png
  # No Apple Developer account, so sign ad-hoc ("-"). This matters: without a
  # valid bundle signature, Apple Silicon refuses a downloaded app outright
  # ("damaged, move to Trash"), which no user can click past. Ad-hoc signed, it
  # degrades to the ordinary "unidentified developer" prompt instead. Proper
  # signing + notarization is the only way to remove that prompt — see BACKLOG.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target: nsis
  icon: ../public/icon-512.png

nsis:
  # Default name has spaces, which makes for an ugly download URL.
  artifactName: ${productName}-Setup-${version}.${ext}
  # A normal installer with a visible destination step, per-user so it needs no
  # admin rights (which also avoids a second UAC prompt on top of SmartScreen).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
